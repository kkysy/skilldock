<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>输入框蓝点预览</title>
    <style>
      body { margin: 0; padding: 60px; background: #f4f1ea; font-family: "Segoe UI", "PingFang SC", sans-serif; }
      .demo { max-width: 560px; margin: 0 auto; }
      textarea, input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d9d2c5; border-radius: 10px; font-size: 14px; }
      textarea { min-height: 90px; margin-top: 16px; }
    </style>
    <link rel="stylesheet" href="../content/content.css" />
  </head>
  <body>
    <div class="demo">
      <h2>留言板</h2>
      <input type="text" placeholder="标题" />
      <textarea placeholder="写点正文……"></textarea>
    </div>
    <script>
      // 预览桩：替代扩展环境里的 chrome.runtime
      window.chrome = {
        runtime: {
          sendMessage: async () => ({ ok: true, settings: { inputDot: true } }),
          onMessage: { addListener() {} }
        }
      };
    </script>
    <script src="../content/content.js"></script>
  </body>
</html>
